name: hayat_simulasyonu
description: İstatistiğe, şansa ve seçimlere dayalı hikayeli hayat simülasyonu.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  gal: ^2.3.0            # sonuç görselini galeriye kaydeder
  share_plus: ^10.1.4    # sonuç görselini paylaşır
  path_provider: ^2.1.5  # paylaşım için geçici dosya
  shared_preferences: ^2.3.3  # başarıların kalıcı saklanması

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
