workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "life simulator:different life"
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - hayat_simulasyonu_profile
        certificates:
          - dist_cert_2026
    scripts:
      - name: Paketleri al
        script: flutter packages pub get
      - name: Code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: IPA uret
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
